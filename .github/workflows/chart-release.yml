name: Release Helm Chart

# Publishes the chart as an OCI artifact to GitHub's container registry, next
# to the operator image:
#   oci://ghcr.io/wheetazlab/charts/cloudflare-zero-trust-operator:<version>
# A version that is already there is left alone (bump Chart.yaml's version to
# publish a change).

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
  CHART_DIR: charts/cloudflare-zero-trust-operator

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push the chart to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Package and push (new versions only)
        run: |
          name=$(yq '.name' "$CHART_DIR/Chart.yaml")
          version=$(yq '.version' "$CHART_DIR/Chart.yaml")
          if helm show chart "$CHART_REPO/$name" --version "$version" >/dev/null 2>&1; then
            echo "$name $version is already published; nothing to do"
            exit 0
          fi
          helm package "$CHART_DIR" --destination dist
          helm push "dist/$name-$version.tgz" "$CHART_REPO"
          echo "Published $CHART_REPO/$name:$version"
